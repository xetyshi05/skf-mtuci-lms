services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mrsmtuci-frontend
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    environment:
      - NODE_ENV=production
    networks:
      - mrsmtuci-net

networks:
  mrsmtuci-net:
    driver: bridge
